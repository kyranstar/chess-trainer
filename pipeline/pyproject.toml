[project]
name = "trainer-pipeline"
version = "0.1.0"
description = "Mac-side content preparation and game analysis for the chess trainer"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
  "chess==1.11.2",
  "zstandard==0.25.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trainer_pipeline"]
