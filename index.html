<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f3b2c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trainer" />
    <meta name="description" content="Personal offline-first chess coach" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Chess Trainer</title>
      <script>
      // The look is painted before the app's code loads (ADR-064): ground colour and scheme only.
      (function () {
        try {
          var l = localStorage.getItem('ct.look');
          if (l !== 'studio' && l !== 'night') l = 'clubroom';
          var dark = l === 'night' || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var bg = { clubroom: dark ? '#0f1713' : '#F3F1EA', studio: dark ? '#0E1116' : '#F7F8FA', night: '#111315' }[l];
          var d = document.documentElement;
          d.setAttribute('data-look', l);
          d.style.setProperty('--paper', bg);
          d.style.background = bg;
          d.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
